<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartCrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8fafc;
            background-image: url("{% static 'images/signupimage.jpg' %}");
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif; padding: 20px;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.85), rgba(226, 232, 240, 0.8));
            backdrop-filter: blur(8px); z-index: 1;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px; padding: 40px 50px;
            width: 100%; max-width: 450px; position: relative; z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
            animation: slideInUp 0.8s ease-out;
        }
        
        /* BRAND LOGO STYLE */
        .brand-header {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-bottom: 5px;
        }
        .brand-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            color: #2563eb;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
        }
        .brand-icon {
            font-size: 2.5rem; color: #3b82f6;
        }

        .input-group-text { background: #f8fafc; border: 1px solid #e2e8f0; border-right: none; color: #64748b; }
        .form-control { border-left: none; background: #f8fafc; border-color: #e2e8f0; padding: 12px; transition: all 0.3s; }
        .form-control:focus { background: white; box-shadow: none; border-color: #3b82f6; }
        .form-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 5px; text-align: left; display: block; }
        .input-group .form-control:focus { z-index: 0; }

        .btn-smart {
            background: linear-gradient(90deg, #2563eb, #3b82f6); border: none; color: white;
            padding: 14px; font-weight: 700; letter-spacing: 1px; border-radius: 12px !important; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-smart:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); color: white; }
        .text-blue { color: #2563eb; }
        .hover-underline:hover { text-decoration: underline !important; }

        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="login-card">
        
        <div class="brand-header">
            <i class="fas fa-seedling brand-icon"></i>
            <span class="brand-text">SmartCrop</span>
        </div>

        <p class="text-muted small mb-4">Access your SmartCrop Dashboard</p>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small shadow-sm border-0">
            <i class="fas fa-exclamation-circle me-2"></i> Incorrect username or password.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label ms-1">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    {{ form.username }}
                </div>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label ms-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    {{ form.password }}
                </div>
            </div>
            <button type="submit" class="btn btn-smart w-100 shadow">LOG IN</button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">New farmer? <a href="{% url 'signup' %}" class="text-blue fw-bold text-decoration-none hover-underline">Create Account</a></p>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var inputs = document.querySelectorAll('input');
            inputs.forEach(function(input) {
                if (input.type !== 'hidden') {
                    input.classList.add('form-control');
                    input.placeholder = "Enter your " + input.name;
                }
            });
        });
    </script>
</body>
</html>
