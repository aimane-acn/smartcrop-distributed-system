<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartCrop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #2563eb;
        }

        body {
            background-color: #0b1120;
            background-image: url("{% static 'images/signupimage.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            padding: 24px;
            margin: 0;
            position: relative;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 17, 32, 0.85) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 42px 45px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            animation: slideInUp 0.6s ease-out;
        }

        /* Top Nav inside card */
        .card-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #10b981;
        }

        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #059669;
            background: #ecfdf5;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        /* BRAND LOGO STYLE */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .brand-icon-box {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        .brand-text {
            font-weight: 800;
            color: #0f172a;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        /* Form Inputs */
        .input-group-text {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: none;
            color: #64748b;
            padding-left: 14px;
            border-top-left-radius: 12px !important;
            border-bottom-left-radius: 12px !important;
        }

        .form-control {
            border-left: none;
            background: #f8fafc;
            border-color: #e2e8f0;
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: all 0.25s;
        }

        .form-control:focus {
            background: white;
            box-shadow: none;
            border-color: #10b981;
        }

        .input-group:focus-within .input-group-text {
            border-color: #10b981;
            color: #10b981;
            background: white;
        }

        .toggle-password {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: none;
            color: #94a3b8;
            cursor: pointer;
            padding-right: 14px;
            border-top-right-radius: 12px !important;
            border-bottom-right-radius: 12px !important;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #334155;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            margin-bottom: 6px;
            text-align: left;
            display: block;
        }

        .btn-smart {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            padding: 13px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            border-radius: 12px !important;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-smart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(16, 185, 129, 0.4);
            color: white;
        }

        .link-accent {
            color: #059669;
            font-weight: 700;
            text-decoration: none;
        }

        .link-accent:hover {
            color: #047857;
            text-decoration: underline !important;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-card">
        
        <!-- Top Nav -->
        <div class="card-top-nav">
            <a href="{% url 'home' %}" class="back-link">
                <i class="fas fa-arrow-left"></i> Home
            </a>
            <span class="badge-secure">
                <i class="fas fa-lock"></i> Protected
            </span>
        </div>

        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon-box">
                <i class="fas fa-seedling"></i>
            </div>
            <span class="brand-text">SmartCrop</span>
        </div>

        <p class="brand-subtitle">Sign in to your Crop Health Dashboard</p>

        <!-- Alerts -->
        {% if form.errors %}
        <div class="alert alert-danger py-2 small shadow-sm border-0 rounded-3 text-start mb-3">
            <i class="fas fa-exclamation-circle me-1"></i> Incorrect username or password. Please try again.
        </div>
        {% endif %}

        <!-- Form -->
        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label ms-1">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    {{ form.username }}
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label ms-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    {{ form.password }}
                    <span class="toggle-password" id="togglePasswordBtn">
                        <i class="fas fa-eye" id="passwordIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-smart w-100">
                Sign In <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
                New farmer? 
                <a href="{% url 'signup' %}" class="link-accent ms-1">Create Account</a>
            </p>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var inputs = document.querySelectorAll('input');
            inputs.forEach(function(input) {
                if (input.type !== 'hidden') {
                    input.classList.add('form-control');
                    input.placeholder = "Enter your " + input.name;
                }
            });

            // Password Toggle Logic
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passInput = document.querySelector('input[type="password"]');
            const passIcon = document.getElementById('passwordIcon');

            if (toggleBtn && passInput) {
                toggleBtn.addEventListener('click', function() {
                    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passInput.setAttribute('type', type);
                    if (type === 'text') {
                        passIcon.classList.remove('fa-eye');
                        passIcon.classList.add('fa-eye-slash');
                    } else {
                        passIcon.classList.remove('fa-eye-slash');
                        passIcon.classList.add('fa-eye');
                    }
                });
            }
        });
    </script>
</body>
</html>
