{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartCrop - Intelligent Agriculture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -1; filter: brightness(0.6);
        }
        
        .hero-container {
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white; padding: 20px;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 80px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 1s ease-out;
        }
        
       .hero-title {
            font-family: 'Inter', sans-serif;
            font-size: 5.5rem; 
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .hero-title i {
            color: #4ade80;
        }

        .hero-subtitle {
            font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #e2e8f0; margin-bottom: 2rem;
        }

        .btn-smart {
            background: #2563eb;
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-smart:hover {
            background: #1d4ed8;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        .btn-outline-smart {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid white;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .btn-outline-smart:hover {
            background: white;
            color: #0f172a;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
    </video>

    <div class="hero-container">
        <div class="glass-box">
            <h1 class="hero-title"><i class="fas fa-seedling"></i> SmartCrop</h1>
            <p class="hero-subtitle">Advanced Plant Disease Detection</p>
            <div class="mt-5 d-flex justify-content-center gap-4">
                <a href="{% url 'login' %}" class="btn btn-smart btn-lg px-5 rounded-pill fw-bold">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-outline-smart btn-lg px-5 rounded-pill fw-bold">Sign Up</a>
            </div>
        </div>
    </div>
</body>
</html>
